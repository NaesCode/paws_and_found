name: Build & Release Android APK

on:
  # Automatically builds and publishes a release when pushing a version tag (e.g. v1.0.0)
  push:
    tags:
      - 'v*.*.*'

  # Allows manually triggering a build & release from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v1.0.1 or latest)'
        required: true
        default: 'latest'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Restore Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is empty! Google Sign-In will fail on this APK."
          else
            mkdir -p "$HOME/.android"
            python3 -c '
          import os, re, base64
          raw = re.sub(r"[^A-Za-z0-9+/=]", "", os.environ["ANDROID_KEYSTORE_BASE64"])
          raw += "=" * ((4 - len(raw) % 4) % 4)
          data = base64.b64decode(raw, validate=True)
          for dest in [os.path.expanduser("~/.android/debug.keystore"), "mobile_app/android/app/ci-debug.keystore"]:
              with open(dest, "wb") as f:
                  f.write(data)
          print("Restored debug.keystore successfully.")
          '
            keytool -list -v -keystore "mobile_app/android/app/ci-debug.keystore" -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:" || true
          fi

      - name: Build universal release APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Print APK signing certificate SHA-1
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs mobile_app/build/app/outputs/flutter-apk/app-release.apk | grep -iE "SHA-1|SHA-256" || true
          fi

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Paws & Found ${{ steps.release_tag.outputs.tag }}
          files: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
