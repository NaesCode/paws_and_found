# Docker Compose override file for live demo hardening (Phase 4 / 5E)
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build

services:
  backend:
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=2
      - --threads=4
      - --timeout=120
      - --access-logfile=-
      - --error-logfile=-
    environment:
      - DEBUG=False

