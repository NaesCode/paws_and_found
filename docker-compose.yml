services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paws_backend
    restart: unless-stopped
    # Development: Gunicorn with --reload so StatReloader picks up file changes.
    # Remove --reload for a clean production build.
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=2
      - --threads=4
      - --timeout=120
      - --reload
      - --access-logfile=-
      - --error-logfile=-
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TORCH_HOME=/opt/torch
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
