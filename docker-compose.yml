services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paws_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"