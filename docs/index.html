<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verified - Paws and Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #F8F9FA;
      color: #2D3142;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      max-width: 420px;
      width: 100%;
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
      border: 1px solid #ECEFF1;
    }
    .brand-title {
      font-family: 'Caveat', cursive;
      font-size: 38px;
      font-weight: 700;
      color: #2D3142;
      line-height: 1.1;
      margin-bottom: 24px;
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      background-color: #E8F5E9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }
    .icon-wrapper svg {
      width: 44px;
      height: 44px;
      stroke: #2E7D32;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #2D3142;
      margin-bottom: 12px;
    }
    p {
      color: #6C757D;
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 20px;
    }
    .instruction-box {
      background-color: #F1F3F5;
      border-radius: 16px;
      padding: 16px;
      font-size: 14px;
      color: #495057;
      font-weight: 500;
      margin-top: 10px;
    }
    .paw-icon {
      font-size: 18px;
      vertical-align: middle;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-title">Paws and Found</div>
    
    <div class="icon-wrapper">
      <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <h1>Email Verified!</h1>
    
    <p>
      Thank you for verifying your email address. Your <strong>Paws and Found</strong> account is now officially active and secure.
    </p>

    <div class="instruction-box">
      <span class="paw-icon">🐾</span> You can now close this window and return to the mobile app to log in.
    </div>
  </div>
</body>
</html>
